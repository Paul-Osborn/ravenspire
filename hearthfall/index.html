function makeHero(name,klass,sp){return {id:'h'+Date.now().toString(36),name,klass,sp,hp:CL[klass].hp,max:CL[klass].hp,ac:CL[klass].ac,uses:CL[klass].uses,items:[CL[klass].weapon,'Travel cloak','Torch'],skills:['Perception','Insight','Athletics'],gold:25}}function active(){return [g?.hero,...(g?.companions||[])].find(x=>x&&x.id===g.activeId)||g?.hero}function newGame(){let h=HOOKS[config.hook],name=config.name.trim()||['Kaelen','Mara','Seris','Rowan'][rng(4)-1];g={id:'hf'+Date.now().toString(36),title:h.title,hook:config.hook,kind:h.kind,scene:h.kind+'-entrance',chapter:1,hero:makeHero(name,config.cls,config.species),companions:[['Seraphine','Wizard','Elf'],['Bram','Cleric','Dwarf'],['Lira','Rogue','Human'],['Torren','Ranger','Orc']].slice(0,config.companions).map(x=>makeHero(...x)),activeId:null,npc:h.npc,mood:'grim',gold:25,turn:0,passage:'The night holds its breath. Beyond the last lantern, something waits to be named.',dialogue:'',choices:['Examine the approach','Speak to the waiting stranger','Venture into the darkness'],notebook:[h.short],history:[],rolls:[],foes:[],combat:false,art:{},tone:config.tone,voiceMap:{},lastAction:''};g.activeId=g.hero.id;ensureArt();screen='game';save();render();chapter();requestDM('Begin the opening cinematic prologue for this chosen campaign. The player has not acted yet.',true)}function chapter(){let el=document.createElement('div');el.className='chapter';el.innerHTML=`<div><div class="caps">Prologue · The first breath</div><h1>${esc(g.title)}</h1><p class="sub">All stories are paid for in something.</p><button class="primary" data-go="chapter-close">Enter the chapter</button></div>`;host.appendChild(el);el.querySelector('button').addEventListener('click',()=>{el.remove();if(config.voice)talk()})}function stopSpeech(){try{speechSynthesis.cancel()}catch{}}function talk(){if(!g||!('speechSynthesis'in window)){notice('Your browser does not support spoken narration.');return}stopSpeech();let narr=new SpeechSynthesisUtterance(g.passage);narr.pitch=.87;narr.rate=.87;let voices=speechSynthesis.getVoices();narr.voice=voices.find(x=>/en/.test(x.lang)&&/male|David|Daniel/i.test(x.name))||voices.find(x=>/en/.test(x.lang))||null;narr.onend=()=>{if(!g.dialogue)return;let line=new SpeechSynthesisUtterance(g.dialogue);line.pitch=1.09;line.rate=['urgent','terrified','angry'].includes(g.mood)?1.12:['whisper','weary','menacing'].includes(g.mood)?.78:.95;line.voice=voices.find(x=>x!==narr.voice&&/en/.test(x.lang))||voices[1]||narr.voice;speechSynthesis.speak(line)};speechSynthesis.speak(narr)}function music(){config.music=!config.music;if(!config.music){nodes.forEach(x=>{try{x.stop()}catch{}});nodes=[];audio?.close();audio=null;render();return}try{audio=new (window.AudioContext||window.webkitAudioContext)();let master=audio.createGain();master.gain.value=.022;master.connect(audio.destination);for(let freq of [55,82.41,110,164.81]){let osc=audio.createOscillator();osc.type='sine';osc.frequency.value=freq;let gg=audio.createGain();gg.gain.value=.65;osc.connect(gg).connect(master);osc.start();nodes.push(osc)}render()}catch{config.music=false;notice('Audio is not available in this browser.')}}function notice(msg){modal={type:'notice',msg};renderModal()};function addRoll(label,die,bonus,dc,success){g.rolls.unshift({label,die,bonus,dc,total:die+bonus,success});g.rolls=g.rolls.slice(0,30);g.history.push({type:'roll',label,die,bonus,dc,success})}function rollCheck(label,bonus,dc,finish){pending={label,bonus,dc,finish};modal={type:'roll'};renderModal();if(config.auto)setTimeout(doRoll,180)}function doRoll(){if(!pending)return;let d=rng(20),p=pending,ok=d===20||(d!==1&&d+p.bonus>=p.dc);addRoll(p.label,d,p.bonus,p.dc,ok);pending=null;modal=null;p.finish({die:d,total:d+p.bonus,success:ok,crit:d===20});save();render()}function doCombatAction(mode){let h=active(),foe=g.foes.find(x=>x.hp>0);if(!foe)return requestDM('There are no active enemies; narrate the scene.');let cfg=CL[h.klass];if(mode==='heal'){if(!h.uses||!['Fighter','Cleric','Bard'].includes(h.klass)){notice('No healing uses remain.');return}h.uses--;let expr=h.klass==='Fighter'?'1d10+1':h.klass==='Cleric'?'1d8+3':'1d4+3',n=rollExpr(expr);h.hp=Math.min(h.max,h.hp+n);sendResolution(`Used ${cfg.ability}. Restored ${n} HP. Hero now ${h.hp}/${h.max} HP.`,true);return}let bonus=cfg.bonus;rollCheck(h.name+' · '+cfg.weapon,bonus,foe.ac,r=>{let damage=0;if(r.success){damage=rollExpr(cfg.damage);if(r.crit)damage+=rollExpr(cfg.damage.replace(/[+-]\d+$/,''));foe.hp=Math.max(0,foe.hp-damage)}let out=`${h.name} attacks ${foe.name} with ${cfg.weapon}: d20 ${r.die} + ${bonus} = ${r.total} against AC ${foe.ac}; ${r.success?'hit for '+damage+' damage':'miss'}${r.crit?' (critical)':''}. Foe has ${foe.hp}/${foe.max} HP.`;if(!g.foes.some(x=>x.hp>0)){g.foes=[];g.combat=false;g.gold+=7;out+=' Victory. Gained 7 crowns.'}else{for(const f of g.foes.filter(x=>x.hp>0)){let t=TIERS[f.tier],d=rng(20),hit=d===20||d!==1&&d+t[2]>=h.ac;let n=hit?rollExpr(t[3]):0;if(d===20)n+=rollExpr(t[3].replace(/[+-]\d+$/,''));h.hp=Math.max(0,h.hp-n);out+=` ${f.name} retaliates: d20 ${d} + ${t[2]} vs AC ${h.ac}; ${hit?'deals '+n+' damage':'misses'}.`;if(h.hp===0){out+=' The hero collapses. They will awaken with 1 HP after this consequence is narrated.';g.combat=false;g.foes=[];break}}}sendResolution(out,true)})}function sendResolution(text,ask){g.history.push({type:'engine',text});g.lastAction=text;g.turn++;save();render();if(ask)requestDM(text)}function action(text){if(!g||!text.trim())return;typing='';let val=text.trim();let l=val.toLowerCase();if(g.combat){if(/heal|wound|wind/.test(l))return doCombatAction('heal');if(/flee|retreat|escape/.test(l)){g.combat=false;g.foes=[];return sendResolution('Hero fled combat. The game engine ended the encounter.',true)}return doCombatAction('attack')}if(/attack|fight|strike|draw.*weapon|combat/.test(l)){let foeName=HOOKS[g.hook].foe;g.foes=[{name:foeName,tier:'minion',hp:7,max:7,ac:12},{name:'Ashen Guard',tier:'soldier',hp:13,max:13,ac:13}];g.combat=true;g.history.push({type:'engine',text:'Combat begins against '+g.foes.map(x=>x.name).join(' and ')});g.lastAction=val;save();render();return requestDM('Player chose: '+val+'. Combat started with real foes. Introduce the attack dramatically; ask for their action.')}if(/search|inspect|investigate|examine|listen for|notice|persuade|sneak|climb|force|deceive|perception/.test(l)){let skill=/sneak/.test(l)?'Stealth':/persuade|deceive/.test(l)?'Persuasion':/force|climb/.test(l)?'Athletics':'Investigation';return rollCheck(active().name+' · '+skill,skill==='Athletics'?4:3,13,r=>sendResolution(`Player action: ${val}. ${skill} check: natural ${r.die}, modifier +${skill==='Athletics'?4:3}, total ${r.total} vs DC 13. ${r.success?'SUCCESS':'FAILURE'}.`,true))}if(/rest|sleep/.test(l)){[g.hero,...g.companions].forEach(h=>{h.hp=h.max;h.uses=CL[h.klass].uses});return sendResolution('Player takes a long rest. All HP and limited powers restored. Narrate the passage of time.',true)}g.lastAction=val;g.turn++;g.history.push({type:'player',text:val});save();render();requestDM(val)}function requestDM(action,isNew=false){if(!g)return;let snapshot={campaign_id:g.id,title:g.title,hook:HOOKS[g.hook].short,tone:g.tone,chapter:g.chapter,scene:g.scene,kind:g.kind,hero:g.hero,companions:g.companions,active_id:g.activeId,npc:g.npc,foes:g.foes,combat:g.combat,gold:g.gold,notebook:g.notebook,rolls:g.rolls.slice(0,7),history:g.history.slice(-12),current_passage:g.passage,turn:g.turn};let payload={action,state:snapshot,isNew};if(typeof globalThis.__bindings?.askDM==='function'){try{globalThis.__bindings?.askDM?.(JSON.stringify(payload))}catch{notice('ChatGPT handoff is unavailable in this preview. Your game is saved.')}}else{notice('The ChatGPT Dungeon Master connection is unavailable in this preview. Your game is saved and your dice and combat still work.')}}function receiveScene(msg){if(!g||!msg||!msg.narration)return;if(msg.scene&&msg.scene!==g.scene){g.scene=msg.scene;g.kind=msg.kind||g.kind;g.chapter=msg.chapter||g.chapter;ensureArt()}else if(msg.chapter)g.chapter=msg.chapter;if(msg.title)g.title=msg.title;if(msg.npc)g.npc=msg.npc;if(msg.mood)g.mood=msg.mood;g.passage=msg.narration;g.dialogue=msg.dialogue||'';g.choices=Array.isArray(msg.choices)?msg.choices.slice(0,3):g.choices;if(Array.isArray(msg.notebook))g.notebook.push(...msg.notebook);g.history.push({type:'dm',text:msg.narration});ensureArt();save();render();if(config.voice)talk()}
function exportGame(){if(!g)return;let a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(g,null,2)],{type:'application/json'}));a.href=url;a.download='Hearthfall-'+g.hero.name+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000)}function voiceInput(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return notice('Microphone transcription is not supported in this browser.');stopSpeech();try{recognition=new R();recognition.lang='en-US';recognition.interimResults=true;recognition.onresult=e=>{typing=Array.from(e.results).map(x=>x[0].transcript).join(' ');let input=host.querySelector('#hf-action');if(input)input.value=typing};recognition.onerror=()=>notice('Microphone permission was blocked or speech was not recognized.');recognition.start()}catch{notice('Microphone recognition could not start.')}}function modalHtml(){if(!modal)return'';if(modal.type==='roll')return `<div class="modalback"><div class="dialog" style="text-align:center"><div class="caps">The fates awaken</div><h2>${esc(pending.label)}</h2><div class="die">20</div><p class="muted">Bonus +${pending.bonus} · Target ${pending.dc}</p><button data-do="roll" class="primary">Roll the die</button></div></div>`;if(modal.type==='settings')return `<div class="modalback"><div class="dialog"><div class="row space"><h2>Settings</h2><button data-do="close">×</button></div><p><label><input type="checkbox" id="hf-voice" ${config.voice?'checked':''} style="width:auto"> Narrate aloud</label></p><p><label><input type="checkbox" id="hf-auto" ${config.auto?'checked':''} style="width:auto"> Roll automatically</label></p><p class="muted">Voice and microphone features depend on your browser.</p><button data-do="export">Export campaign</button></div></div>`;if(modal.type==='journal')return `<div class="modalback"><div class="dialog"><div class="row space"><h2>Campaign journal</h2><button data-do="close">×</button></div><p class="caps">${esc(g.title)}</p>${g.notebook.slice(-12).map(x=>`<p class="muted">✧ ${esc(x)}</p>`).join('')}<div class="caps">Recent events</div>${g.history.slice(-8).map(x=>`<p class="muted">${esc(x.text||x.label||'')}</p>`).join('')}<button data-do="export">Save backup</button></div></div>`;return `<div class="modalback"><div class="dialog"><div class="row space"><h2>Hearthfall</h2><button data-do="close">×</button></div><p>${esc(modal.msg||'')}</p><button class="gold" data-do="close">Continue</button></div></div>`}function render(){let h=g?.hero;host.innerHTML=`<header class="top"><button aria-label="Home" data-do="home" class="mini">✦</button><div class="logo">HEARTHFALL</div><div class="toolbar">${g&&screen==='game'?'<button data-do="speaker" title="Narrate">◖</button><button data-do="music" title="Ambient music">♫</button><button data-do="journal" title="Journal">☷</button>':''}<button data-do="settings" title="Settings">⚙</button></div></header>${screen==='title'?`<section class="landing"><div class="sigil">H</div><div class="caps">A living dark-fantasy chronicle</div><h1>Hearthfall</h1><p class="sub">The story bends to your choices.<br>The dice do not.</p><p><button class="primary" data-do="new">Begin a new chronicle</button></p><div class="panel" style="max-width:510px;text-align:left;margin:50px auto 0"><div class="caps">Your chronicles</div>${slots.length?slots.map((x,i)=>`<div class="row space" style="margin-top:14px"><div><b>${esc(x.hero.name)}</b><br><small>${esc(x.title)}</small></div><button class="gold" data-load="${i}">Continue</button><button class="mini" data-delete="${i}">×</button></div>`).join(''):'<p class="muted">No campaigns yet. The first page is blank.</p>'}</div></section>`:screen==='setup'?`<div class="screen"><div class="caps">Character creation · Prologue</div><h2>Choose your darkness</h2><div class="grid">${HOOKS.map((x,i)=>`<button class="opt ${config.hook===i?'sel':''}" data-hook="${i}"><b>${esc(x.title)}</b><small>${esc(x.short)}</small></button>`).join('')}</div><div class="panel" style="margin-top:14px"><h2>Who walks into the night?</h2><div class="row"><div class="field"><label>Hero name</label><input id="hf-name" placeholder="Choose a name" value="${esc(config.name)}"></div><div class="field"><label>Species</label><select id="hf-species">${SPECIES.map(x=>`<option ${config.species===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="caps" style="margin:15px 0">Your class</div><div class="grid">${Object.entries(CL).map(([x,v])=>`<button class="opt ${config.cls===x?'sel':''}" data-class="${x}"><b>${x}</b><small>${v.hp} HP · AC ${v.ac}<br>${esc(v.weapon)} · ${esc(v.ability)}</small></button>`).join('')}</div><div class="row"><div class="field"><label>Tone</label><select id="hf-tone"><option>Grim</option><option ${config.tone==='Sword & sorcery'?'selected':''}>Sword & sorcery</option></select></div><div class="field"><label>Companions</label><select id="hf-comp">${[0,1,2,3,4].map(n=>`<option ${config.companions===n?'selected':''}>${n}</option>`).join('')}</select></div></div><p class="under">A cinematic illustration is created as you enter a scene, not beforehand.</p><button class="primary" data-do="begin" style="width:100%">Begin my legend</button></div></div>`:`<div class="hero-strip" style="overflow-x:auto">${[g.hero,...g.companions].map(x=>`<button data-actor="${x.id}" class="herochip" style="flex-shrink:0;background:${x.id===g.activeId?'#493227':'#1b1c1d'};border-color:${x.id===g.activeId?'#e1ab67':'#6a5442'}"><div class="avatar">${g.art['portrait:'+x.name]||faceSvg(x.name,x.sp)}</div><div style="min-width:0"><div class="heroname">${esc(x.name)}</div><div class="under">${x.klass} · AC ${x.ac}</div><div class="health"><span style="width:${100*x.hp/x.max}%"></span></div><div class="under">${x.hp}/${x.max} HP</div></div></button>`).join('')}<div class="under" style="white-space:nowrap">${g.gold} crowns</div></div><div class="stage"><div class="art">${g.art['scene:'+g.scene]}</div>${g.dialogue?`<div class="face">${g.art['portrait:'+g.npc]||faceSvg(g.npc)}</div>`:''}<div class="placard"><div class="caps">Chapter ${g.chapter} · ${esc(g.title)}</div><b>${esc(g.scene.replace(/[-_]/g,' '))}</b></div></div><div class="scenebar"><span class="caps">Turn ${g.turn} · ${g.combat?'Combat':'Story'}</span><span class="row"><button class="mini" data-do="speaker">Listen</button><button class="mini" data-do="art">Art</button></span></div><section class="story"><div class="prose">${esc(g.passage)}</div>${g.dialogue?`<div class="quote"><small>${esc(g.npc)} · ${esc(g.mood)}</small>“${esc(g.dialogue)}”</div>`:''}<div class="row space" style="margin-top:12px"><span class="caps">${g.combat?'Live combat':'The story is yours'}</span><button class="gold mini" data-do="dm">Ask GPT-6 · Dungeon Master</button></div></section>${g.combat?`<div class="panel" style="margin:0 12px 12px"><div class="caps">Enemies</div>${g.foes.filter(x=>x.hp>0).map(x=>`<div style="margin-top:10px">${esc(x.name)} · ${x.hp}/${x.max} HP · AC ${x.ac}<div class="health"><span style="width:${x.hp/x.max*100}%"></span></div></div>`).join('')}<div class="row" style="margin-top:11px"><button data-do="strike">Attack</button><button data-do="heal">Use healing</button><button data-do="flee">Flee</button></div></div>`:''}<div class="actions">${g.choices.map((x,i)=>`<button data-choice="${i}"><small>CHOICE ${i+1}</small>${esc(x)}</button>`).join('')}</div><div class="compose"><button data-do="mic" title="Speak">🎙</button><input id="hf-action" placeholder="What do you do?" value="${esc(typing)}"><button class="primary" data-do="send">Act</button></div><div class="hud"><div class="panel"><div class="caps">Character · Abilities</div><p>${esc(CL[h.klass].weapon)} · +${CL[h.klass].bonus} · ${CL[h.klass].damage}</p><p>${esc(CL[h.klass].ability)} · ${h.uses} uses left</p><small>${h.items.map(esc).join(' · ')}</small></div><div class="panel"><div class="caps">Dice history</div><div class="rollchips" style="margin-top:8px">${g.rolls.length?g.rolls.slice(0,5).map(r=>`<span class="badge ${r.success?'ok':'bad'}">d20 ${r.die} + ${r.bonus} = ${r.total} · ${r.success?'Success':'Fail'}</span>`).join(''):'<small>No dice rolled yet</small>'}</div></div></div><div class="foot">Every numeric outcome comes from the game engine · Campaign autosaved where browser storage permits</div>`}${modal?modalHtml():''}`}
function renderModal(){if(!modal){render();return}let m=host.querySelector('.modalback');if(m)m.remove();host.insertAdjacentHTML('beforeend',modalHtml())}host.addEventListener('input',e=>{if(e.target.id==='hf-name')config.name=e.target.value;if(e.target.id==='hf-action')typing=e.target.value});host.addEventListener('change',e=>{let id=e.target.id;if(id==='hf-species')config.species=e.target.value;if(id==='hf-tone')config.tone=e.target.value;if(id==='hf-comp')config.companions=+e.target.value;if(id==='hf-voice')config.voice=e.target.checked;if(id==='hf-auto')config.auto=e.target.checked;if(id==='hf-file'){let file=e.target.files?.[0];if(file){let reader=new FileReader();reader.onload=()=>{let i=new Image();i.onload=()=>{let ca=document.createElement('canvas'),k=Math.min(1,1400/i.width,1400/i.height);ca.width=i.width*k;ca.height=i.height*k;ca.getContext('2d').drawImage(i,0,0,ca.width,ca.height);g.art['scene:'+g.scene]=ca.toDataURL('image/jpeg',.85);save();modal=null;render()};i.src=reader.result};reader.readAsDataURL(file)}}});host.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='hf-action'){e.preventDefault();action(typing)}});host.addEventListener('click',e=>{let b=e.target.closest('[data-do],[data-class],[data-hook],[data-choice],[data-load],[data-delete],[data-actor]');if(!b)return;let d=b.dataset;if(d.hook!==undefined){config.hook=+d.hook;render();return}if(d.class){config.cls=d.class;render();return}if(d.choice!==undefined){action(g.choices[+d.choice]);return}if(d.load!==undefined){g=slots[+d.load];screen='game';ensureArt();render();return}if(d.actor){g.activeId=d.actor;render();return}if(d.delete!==undefined){if(confirm('Delete this campaign?')){slots.splice(+d.delete,1);try{localStorage.setItem(rk,JSON.stringify(slots))}catch{}render()}return}switch(d.do){case'home':screen='title';stopSpeech();render();break;case'new':screen='setup';render();break;case'begin':newGame();break;case'chapter-close':break;case'settings':modal={type:'settings'};renderModal();break;case'journal':if(g){modal={type:'journal'};renderModal()}break;case'close':modal=null;render();break;case'roll':doRoll();break;case'speaker':talk();break;case'music':music();break;case'export':exportGame();break;case'mic':voiceInput();break;case'dm':requestDM('Continue the adventure with full knowledge of the state.');break;case'send':action(typing);break;case'strike':doCombatAction('attack');break;case'heal':doCombatAction('heal');break;case'flee':action('I flee the battle');break;case'art':modal={type:'notice',msg:'This scene was created when you entered it, and will be reused whenever you return. To use a ChatGPT-generated painting, use the file selector below.'};renderModal();let m=host.querySelector('.dialog');if(m)m.insertAdjacentHTML('beforeend','<input id="hf-file" type="file" accept="image/*" aria-label="Replace scene art with a painting">');break;}});
// Model-to-visualization updates can be supplied by a host binding when available.
globalThis.__effect?.(()=>{let incoming=globalThis.__bindings?.sceneUpdate;if(incoming&&g&&incoming.token!==g.lastSceneToken){g.lastSceneToken=incoming.token;receiveScene(incoming)}});if(g)ensureArt();render();})();
