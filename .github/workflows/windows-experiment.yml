name: Windows experiment validation
on:
  push:
    branches: [experiment/windows-first]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm.cmd install --omit=dev --ignore-scripts --no-audit --no-fund
      - run: npm.cmd test
